[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cka-med"
version = "0.1.0"
description = "CKA-MedVQA PoC: Conditional Knowledge Alignment evaluation, data audit, baselines, and training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "huggingface_hub>=0.23",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
